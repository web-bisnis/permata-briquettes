name: Wahyoe Kurniawan, S.E.
role: President Director
photo: team/wahyoe-kurniawan
bio: >-
  Wahyoe Kurniawan, S.E. serves as the President Director of PT. PERMATA BARA GLOBALINDO.
  With over a decade of entrepreneurial experience in the energy supply sector, he supports
  the operations of various manufacturing plants, mining facilities, and land and maritime
  transport companies, while also managing numerous national-scale projects. A Management
  Economics graduate from Universitas Brawijaya, he actively participates in entrepreneurial
  communities and frequently speaks at various business forums.
