bio: >-
  Wahyoe Kurniawan, S.E. menjabat sebagai Direktur Utama PT. PERMATA BARA GLOBALINDO.
  Dengan pengalaman berwirausaha lebih dari satu dekade di sektor pasokan energi, beliau
  mendukung operasional berbagai pabrik manufaktur, fasilitas pertambangan, serta perusahaan
  transportasi darat dan laut, sekaligus mengelola berbagai proyek berskala nasional.
  Lulusan Ekonomi Manajemen Universitas Brawijaya ini aktif dalam komunitas wirausaha dan
  kerap menjadi pembicara di berbagai forum bisnis.
