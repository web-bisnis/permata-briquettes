name: Vera Eka Permatasari
role: Chief Executive Officer
photo: team/vera-eka-permatasari
bio: >-
  Vera Eka Permatasari menjabat sebagai Chief Executive Officer dengan pengalaman berwirausaha
  lebih dari lima tahun di industri skincare dan perawatan kecantikan Indonesia. Sebelum memimpin
  perusahaan, ia memegang posisi kepemimpinan di salah satu merek skincare nasional terkemuka.
  Ia tetap aktif dalam berbagai komunitas wirausaha.
