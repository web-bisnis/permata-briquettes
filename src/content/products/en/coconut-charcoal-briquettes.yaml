  - name: Finger
    sizes: [18×35 mm, 18×50 mm, 20×35 mm, 20×50 mm, 22×48 mm, 22×50 mm]
  - name: Hexagonal
    sizes: [18×35 mm, 18×50 mm, 20×35 mm, 20×50 mm, 22×48 mm, 22×50 mm]
  - name: Flat/Brix
    sizes: [25×25×17 mm]
  - name: Dome
    sizes: [18×35 mm, 18×50 mm, 20×35 mm, 20×50 mm, 22×48 mm, 22×50 mm]
packaging:
  masterCartonKg: [10, 20]
