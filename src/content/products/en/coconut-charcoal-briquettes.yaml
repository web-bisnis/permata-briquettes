locale: en
name: Coconut shell charcoal briquettes for shisha and hookah
components:
  - Coconut shell charcoal
  - Food-grade tapioca
  - Water
uses:
  - Shisha
  - Hookah
referenceOnlyNotice: These figures are references. Final limits and test methods will be specified for the order.
grades:
  - name: Platinum
    specifications:
      ashContent: 1.6–1.9%
      burnTime: 2 h 30 min
      ignitionTime: 10 min
      moisture: 5% max
      fixedCarbon: 80% min
      volatileMatter: 14.5% max
      ashColor: Natural white
  - name: Super Premium
    specifications:
      ashContent: null
      burnTime: 2 h+
      ignitionTime: 10 min
      moisture: 6% max
      fixedCarbon: 80% min
      volatileMatter: 16% max
      ashColor: Natural white
  - name: Premium
    specifications:
      ashContent: 2.3–2.5%
      burnTime: 1 h 30 min+
      ignitionTime: 10 min
      moisture: 8% max
      fixedCarbon: 75% min
      volatileMatter: 18% max
      ashColor: Natural grey
