internalNotes:
  - id: super-premium-ash
    topic: Super Premium ash range
    decision: Omitted from public data because two source values conflict.
    required: Approve either 1.9–2.2% or 2.0–2.2%.
  - id: composition-wording
    topic: Composition wording
    decision: Components are shown as listed; no percentage or label claim is added.
    required: Approve precise wording for labels and technical documents.
  - id: contractual-specification
    topic: Contractual limits and testing
    decision: All published figures remain explicitly reference data.
    required: Approve limits, test methods, and tolerances for each grade.
  - id: flat-dimension-units
    topic: Two additional Flat/Brix sizes
    decision: Omitted because the source does not confirm their units.
    required: Confirm units for 20×20×15 and 22×22×15.
  - id: grade-size-availability
    topic: Grade and size combinations
    decision: No combination is represented as guaranteed available.
    required: Confirm the offered matrix by grade and size.
